[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Semi-E3-MLIP"
version = "0.1.0"
description = "From-scratch conservative scalar-vector E(3) interatomic potential"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]
visualize = ["matplotlib>=3.8", "pillow>=10"]
data = ["lmdb>=2.3"]

[project.scripts]
semi-e3-mlip = "semi_mlip.cli:main"
semi-mlip = "semi_mlip.cli:main"

[tool.setuptools.packages.find]
include = ["semi_mlip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
